agents:
  local-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    containerfile: ./Containerfile
    mounts:
      - source: ./models
        destination: /app/models
  registry-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    image: python:3.11-slim
    mounts:
      - source: ./models
        destination: /app/models

agents:
  local-agent:
    harness_command:
      - bash
    containerfile: ./Containerfile
    mounts:
      - source: ./specs
        destination: /app/specs
  registry-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    image: python:3.11-slim
    mounts:
      - source: ./specs
        destination: /app/specs
  git-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    containerfile: ./Containerfile
    git_workspace:
      base_directory: /tmp/git-agent
    mounts:
      - source: ./spec
        destination: /app/specs

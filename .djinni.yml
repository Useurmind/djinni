default_model: qwen-qwen3-coder-next-fp8
agents:
  local-agent:
    harness_command:
      - opencode
    containerfile: ./Containerfile
    # sync_approach: git_patch
    forceReadonlyRootOff: true
    mounts:
      - source: /home/jgruen/.config/opencode
        destination: /home/agent/.config/opencode
      - source: /home/jgruen/.config/djinni
        destination: /home/agent/.config/djinni
      - source: /home/jgruen/.local/state/opencode
        destination: /home/agent/.local/state/opencode
      - source: /home/jgruen/.local/share/opencode
        destination: /home/agent/.local/share/opencode
    tmpfsMounts:
      - destination: /home/agent
      - destination: /cache
        size: "512m"
  registry-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    image: python:3.11-slim
    mounts:
      - source: ./specs
        destination: /app/specs
  git-agent:
    harness_command:
      - python
      - -m
      - agent.harness
    containerfile: ./Containerfile
    git_workspace:
      base_directory: /tmp/git-agent
    mounts:
      - source: ./spec
        destination: /app/specs
    files_to_copy:
      - source: ~/.gitconfig
        destination: /home/agent/.gitconfig
